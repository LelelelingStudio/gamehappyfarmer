<!-- ============================================================
     加载兜底（内联，不依赖任何外部 JS）
     无论后面的脚本是否报错、网络多慢，最多 6 秒一定放行，绝不绿屏。
     ============================================================ -->
<script>
(function () {
    var FAILSAFE_MS = 6000;
    var done = false;
    function reveal() {
        if (done) return;
        done = true;
        try {
            var el = document.getElementById('loading-screen');
            if (el) {
                el.classList.add('hide');
                setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
            }
            /* 让页面可见（main.css 默认 html{visibility:hidden}） */
            document.documentElement.classList.add('js-loaded');
            /* 如果游戏主流程没起来，至少把起始弹窗露出来，别让玩家看着一片绿 */
            var ss = document.getElementById('start-screen');
            var started = document.body && document.body.classList.contains('game-started');
            if (ss && !started && !ss.classList.contains('show') && (window.__startBound || window.__bootstrapped)) {
                ss.classList.add('show');
            }
        } catch (e) { /* 兜底本身绝不能抛错 */ }
    }
    window.__failsafeReveal = reveal;
    setTimeout(reveal, FAILSAFE_MS);
    /* 任何脚本错误都提前放行 */
    window.addEventListener('error', function () { setTimeout(reveal, 1200); }, true);
})();
</script>
